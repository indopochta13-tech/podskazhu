<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Иконки архива — выберите</title>
  <style>
    :root { --screen:#f3f7f6; --ink:#1c2a28; --accent:#3d7a72; --line:#d9e4e1; --surface:#fff; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--screen); color:var(--ink); padding:20px 16px 40px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#5f726e; margin:0 0 20px; line-height:1.4; }
    .grid { display:grid; gap:14px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; text-align:center; }
    .card img { width:min(72vw,220px); height:auto; image-rendering:auto; background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 16px 16px; border-radius:12px; }
    .n { font-size:28px; font-weight:700; color:var(--accent); margin-bottom:10px; }
    .lab { margin-top:10px; font-size:14px; font-weight:650; }
  </style>
</head>
<body>
  <h1>Иконки архива</h1>
  <p>Напишите в чат номер 1–5 — поставим над микрофоном.</p>
  <div class="grid">
    <div class="card"><div class="n">1</div><img src="archive-icon-1.png" alt="Вариант 1" /><div class="lab">коробка + овальная ручка</div></div>
    <div class="card"><div class="n">2</div><img src="archive-icon-2.png" alt="Вариант 2" /><div class="lab">коробка + ярлык-вырез</div></div>
    <div class="card"><div class="n">3</div><img src="archive-icon-3.png" alt="Вариант 3" /><div class="lab">коробка + три линии</div></div>
    <div class="card"><div class="n">4</div><img src="archive-icon-4.png" alt="Вариант 4" /><div class="lab">ручка сверху</div></div>
    <div class="card"><div class="n">5</div><img src="archive-icon-5.png" alt="Вариант 5" /><div class="lab">открытая коробка</div></div>
  </div>
</body>
</html>
